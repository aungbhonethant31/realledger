<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ledgerly — Voucher & Payment Records</title>
  <style>
    :root{--ink:#24362b;--moss:#486451;--bg:#f5f6f2;--line:#e2e7df;--muted:#718078;--danger:#b42318;--white:#fff;--gold:#b88931}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Noto Sans Myanmar","Myanmar Text",Arial,sans-serif}button,input,select,textarea{font:inherit}.hidden{display:none!important}
    .login-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,#dfe9df 0,transparent 30rem),radial-gradient(circle at 85% 85%,#e8e0cf 0,transparent 28rem),var(--bg)}
    .login-card{width:min(100%,430px);padding:38px;background:#fffc;border:1px solid var(--line);border-radius:22px;box-shadow:0 25px 70px #24362b22}.login-brand{width:52px;height:52px;display:grid;place-items:center;border-radius:15px;background:var(--ink);color:#fff;font-size:22px;font-weight:900}.login-card h1{margin:24px 0 8px;font-size:31px}.login-card>p{color:var(--muted);line-height:1.6;margin:0 0 26px}.login-card label{margin-top:15px}.login-card .btn{width:100%;margin-top:22px}.login-help{margin-top:22px;padding:14px;border-radius:12px;background:#eef1ea;color:var(--muted);font-size:12px;line-height:1.7}.login-error{min-height:19px;margin-top:12px;color:var(--danger);font-weight:700}
    aside{position:fixed;inset:0 auto 0 0;width:245px;background:var(--ink);color:#fff;padding:25px 20px;display:flex;flex-direction:column}.brand{font-size:20px;font-weight:900;margin:3px 10px 30px}.brand small{display:block;font-size:11px;color:#ffffff73;margin-top:5px;font-weight:400}.account{padding:13px;margin-bottom:18px;border:1px solid #ffffff19;border-radius:12px;background:#ffffff0b}.account b{display:block}.account span{display:inline-block;margin-top:6px;padding:3px 8px;border-radius:12px;background:#ffffff17;color:#ffffffb8;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
    nav button{width:100%;border:0;background:none;color:#ffffff99;text-align:left;padding:13px 14px;border-radius:12px;margin:3px 0;cursor:pointer}nav button.active,nav button:hover{background:#fff;color:var(--ink)}aside footer{margin-top:auto}.logout{width:100%;border:1px solid #ffffff2b;background:transparent;color:#fff;padding:10px;border-radius:10px;cursor:pointer}
    main{margin-left:245px;padding:36px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:28px}.top p{margin:7px 0 0;color:var(--muted)}
    .btn{border:0;border-radius:11px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:var(--ink);color:#fff}.soft{background:#edf0ea;color:var(--ink)}.link{background:none;color:var(--moss);padding:5px}.danger{background:none;color:var(--danger);padding:5px}.btn:disabled{opacity:.55;cursor:not-allowed}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 8px 30px #24362b0a}.stat{padding:20px}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:24px;margin-top:12px}.section{margin-top:23px}.section-head{padding:18px 20px;border-bottom:1px solid var(--line);font-weight:800}.toolbar{padding:14px;display:flex;gap:10px;margin-bottom:16px}.field{width:100%;border:1px solid #dfe4dc;border-radius:11px;background:#fff;padding:10px 12px;outline:none}.field:focus{border-color:var(--moss);box-shadow:0 0 0 3px #48645118}.toolbar input{flex:1}.toolbar select,.toolbar input[type=month]{max-width:230px}
    .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th{text-align:left;padding:12px 15px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line)}td{padding:14px 15px;border-bottom:1px solid #eef0ec;white-space:nowrap}tr:last-child td{border:0}.products-cell{min-width:190px;white-space:normal}.chip{display:inline-block;margin:2px 4px 2px 0;padding:5px 8px;border-radius:8px;background:#edf0ea;font-size:11px}.empty{text-align:center;padding:55px 20px;color:var(--muted)}.badge{border-radius:20px;padding:5px 9px;font-size:10px;font-weight:800}.paid{background:#eaf8ee;color:#17733a}.partial{background:#fff5db;color:#926400}.unpaid{background:#eef0ee;color:#58645c}.role-note{padding:12px 15px;margin-bottom:16px;border:1px solid #eadab8;border-radius:12px;background:#fff8e8;color:#76551b}
    dialog{border:0;border-radius:18px;padding:0;width:min(1050px,calc(100% - 30px));box-shadow:0 30px 80px #0004}dialog::backdrop{background:#17211b99}dialog.fallback[open]{display:block;position:fixed;inset:50% auto auto 50%;transform:translate(-50%,-50%);z-index:1000;max-height:calc(100vh - 30px);overflow:auto}.modal-head{padding:20px 23px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0}.modal-body{padding:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.item-row{display:grid;grid-template-columns:minmax(140px,1fr) repeat(4,minmax(105px,130px)) minmax(120px,145px) 34px;gap:8px;margin-bottom:8px;align-items:end}.line-total{background:#f3f5f1;font-weight:800;min-height:40px;display:flex;align-items:center}.voucher-total{margin-top:15px;padding:15px;border-radius:12px;background:#edf0ea;display:flex;justify-content:space-between;align-items:center}.voucher-total strong{font-size:20px}.close{border:0;background:none;font-size:22px;cursor:pointer}.detail-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.detail-summary div{padding:13px;border-radius:11px;background:#f3f5f1}.detail-summary small{display:block;color:var(--muted);margin-bottom:5px}
    .toast{position:fixed;right:18px;bottom:18px;z-index:9999;padding:12px 16px;border-radius:10px;color:white;font-weight:700;box-shadow:0 8px 25px #0003;background:var(--moss)}
    @media(max-width:900px){aside{position:static;width:auto;padding:15px}.brand{margin:0 0 10px}.account{margin:0 0 10px}aside nav{display:flex;overflow:auto}aside footer{margin-top:10px}.logout{width:auto}main{margin:0;padding:20px}.grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}
    @media(max-width:720px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.toolbar{flex-direction:column}.toolbar select,.toolbar input[type=month]{max-width:none}.item-row{grid-template-columns:1fr 1fr}.item-row>div:first-child,.line-wrap{grid-column:1/-1}.detail-summary{grid-template-columns:1fr}main{padding:15px}}
  </style>
</head>
<body>
  <section id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-brand">L</div><h1>Welcome to Ledgerly</h1><p>Sign in to manage customers, vouchers, and payment records.</p>
      <form id="loginForm"><label for="username">Username</label><input id="username" class="field" autocomplete="username" required><label for="password">Password</label><input id="password" class="field" type="password" autocomplete="current-password" required><button class="btn primary" type="submit">Sign in</button><div id="loginError" class="login-error" role="alert"></div></form>

    </div>
  </section>
  <div id="app" class="hidden"><aside><div class="brand">Ledgerly<small>Voucher & payment records</small></div><div class="account"><b id="accountName"></b><span id="accountRole"></span></div><nav id="nav"></nav><footer><button class="logout" onclick="logout()">Sign out</button></footer></aside><main><div class="top"><div><h1 id="title"></h1><p id="subtitle"></p></div><button class="btn primary" id="addBtn"></button></div><div id="view"></div></main></div>
  <dialog id="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button type="button" class="close" onclick="closeModal()" aria-label="Close">×</button></div><form id="form" class="modal-body"></form></dialog>
  <script>
    const KEY='ledgerly-role-v1',OLD_KEY='ledgerly-html-v1',SESSION='ledgerly-role-session';
    const EMPTY={customers:[],vouchers:[],payments:[]},ACCOUNTS={admin:{password:'admin123',role:'admin',label:'Administrator'},user:{password:'user123',role:'user',label:'Normal user'}};
    const clone=x=>JSON.parse(JSON.stringify(x)), $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'MMK',maximumFractionDigits:0}).format(Number(n)||0),date=d=>d?new Date(d+'T00:00:00').toLocaleDateString():'—',today=()=>new Date().toISOString().slice(0,10),newId=()=>Date.now()*1000+Math.floor(Math.random()*1000);
    let db=clone(EMPTY),currentUser=null,page='dashboard',monthFilter='';const modal=$('#modal');
    function load(){try{db=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY)||'null')||clone(EMPTY)}catch{db=clone(EMPTY)};db.customers??=[];db.vouchers??=[];db.payments??=[]}
    function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}render();toast('Saved successfully')}
    function toast(text,error=false){let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el)}el.textContent=text;el.style.background=error?'var(--danger)':'var(--moss)';el.hidden=false;setTimeout(()=>el.hidden=true,1800)}
    function login(e){e.preventDefault();let username=$('#username').value.trim().toLowerCase(),account=ACCOUNTS[username];if(!account||account.password!==$('#password').value){$('#loginError').textContent='Incorrect username or password.';return}currentUser={username,role:account.role,label:account.label};sessionStorage.setItem(SESSION,JSON.stringify(currentUser));showApp()}
    function logout(){sessionStorage.removeItem(SESSION);currentUser=null;$('#app').classList.add('hidden');$('#loginScreen').classList.remove('hidden');$('#loginForm').reset();$('#loginError').textContent='';$('#username').focus()}
    function restoreSession(){try{let saved=JSON.parse(sessionStorage.getItem(SESSION));if(saved&&ACCOUNTS[saved.username])currentUser={username:saved.username,role:ACCOUNTS[saved.username].role,label:ACCOUNTS[saved.username].label}}catch{};currentUser?showApp():$('#username').focus()}
    function showApp(){$('#loginScreen').classList.add('hidden');$('#app').classList.remove('hidden');$('#accountName').textContent=currentUser.username;$('#accountRole').textContent=currentUser.label;page='dashboard';render()}
    const customer=id=>db.customers.find(x=>x.id==id),voucher=id=>db.vouchers.find(x=>x.id==id),itemTotal=x=>(+x.quantity||0)*(+x.unitPrice||0)+(+x.bagCharges||0)+(+x.laborCharges||0),total=v=>(v.items||[]).reduce((s,x)=>s+itemTotal(x),0),paid=v=>db.payments.filter(p=>p.voucherId==v.id).reduce((s,p)=>s+(+p.amount||0),0),balance=v=>Math.max(0,total(v)-paid(v)),status=v=>paid(v)<=0?'unpaid':balance(v)<=0?'paid':'partial',inMonth=(d,m)=>!m||String(d||'').slice(0,7)===m;
    function setPage(next){page=next;monthFilter='';render()}
    function render(){const nav=[['dashboard','Dashboard'],['customers','Customers'],['vouchers','Vouchers'],['payments','Payment records']];$('#nav').innerHTML=nav.map(x=>`<button class="${page===x[0]?'active':''}" onclick="setPage('${x[0]}')">${x[1]}</button>`).join('');({dashboard,customers,vouchers,payments}[page]||dashboard)()}
    function head(title,subtitle,button,action){$('#title').textContent=title;$('#subtitle').textContent=subtitle;$('#addBtn').textContent=button||'';$('#addBtn').classList.toggle('hidden',!button);$('#addBtn').onclick=action||null}
    function dashboard(){head('Dashboard','A summary of all records stored in this browser.',currentUser.role==='admin'?'Record payment':'Add voucher',currentUser.role==='admin'?()=>paymentForm():()=>voucherForm());let sales=db.vouchers.reduce((s,v)=>s+total(v),0),received=db.payments.reduce((s,p)=>s+(+p.amount||0),0),cards=[['Customers',db.customers.length],['Vouchers',db.vouchers.length],['Total sales',money(sales)],['Outstanding',money(Math.max(0,sales-received))]];let recent=[...db.payments].sort((a,b)=>String(b.paymentDate).localeCompare(String(a.paymentDate))).slice(0,5);$('#view').innerHTML=`<div class="grid">${cards.map(c=>`<div class="card stat"><span>${c[0]}</span><strong>${c[1]}</strong></div>`).join('')}</div><div class="card section"><div class="section-head">Recent payments</div>${paymentTable(recent)}</div>`}
    function monthControl(label='Month'){return `<input class="field" type="month" aria-label="${label}" value="${esc(monthFilter)}" onchange="monthFilter=this.value;render()"><button class="btn soft" type="button" onclick="monthFilter='';render()">All months</button>`}
    function customers(){head('Customers','View customer voucher totals for any month.','Add customer',()=>customerForm());let rows=db.customers.map(c=>{let vs=db.vouchers.filter(v=>v.customerId==c.id&&inMonth(v.buyingDate,monthFilter)),t=vs.reduce((s,v)=>s+total(v),0),p=db.payments.filter(x=>x.customerId==c.id&&inMonth(x.paymentDate,monthFilter)).reduce((s,x)=>s+(+x.amount||0),0);return `<tr data-search="${esc((c.name+' '+c.location).toLowerCase())}"><td><b>${esc(c.name)}</b></td><td>${esc(c.location)}</td><td>${vs.length}</td><td>${money(t)}</td><td>${money(p)}</td><td><b>${money(Math.max(0,t-p))}</b></td><td><button class="btn link" onclick="customerRecords(${c.id})">View vouchers</button>${currentUser.role==='admin'?`<button class="btn link" onclick="customerForm(${c.id})">Edit</button><button class="btn danger" onclick="removeCustomer(${c.id})">Delete</button>`:''}</td></tr>`}).join('');$('#view').innerHTML=`${currentUser.role==='user'?'<div class="role-note">User access: you can add customers and vouchers. Payment recording and record editing are reserved for administrators.</div>':''}<div class="card toolbar"><input class="field" placeholder="Search customer or location" oninput="filterRows(this.value)">${monthControl('Filter customer records by month')}</div><div class="card"><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Location</th><th>Vouchers</th><th>Purchases</th><th>Paid</th><th>Balance</th><th>Actions</th></tr></thead><tbody id="rows">${rows}</tbody></table></div>${rows?'':'<div class="empty">No customers found for this view.</div>'}</div>`}
    function vouchers(){head('Vouchers','Browse voucher records and filter them by buying month.','Add voucher',()=>voucherForm());let list=[...db.vouchers].filter(v=>inMonth(v.buyingDate,monthFilter)).sort((a,b)=>String(b.buyingDate).localeCompare(String(a.buyingDate)));$('#view').innerHTML=`<div class="card toolbar"><input class="field" placeholder="Search VR ID, customer, or product" oninput="filterRows(this.value)">${monthControl('Filter vouchers by month')}<select class="field" onchange="filterStatus(this.value)"><option value="">All statuses</option><option value="unpaid">Unpaid</option><option value="partial">Partially paid</option><option value="paid">Paid</option></select></div><div class="card">${voucherTable(list,true)}</div>`}
    function payments(){head('Payment records','View received payments by month.',currentUser.role==='admin'?'Record payment':'',currentUser.role==='admin'?()=>paymentForm():null);let list=[...db.payments].filter(p=>inMonth(p.paymentDate,monthFilter)).sort((a,b)=>String(b.paymentDate).localeCompare(String(a.paymentDate)));$('#view').innerHTML=`${currentUser.role==='user'?'<div class="role-note">Payment records are read-only for normal users.</div>':''}<div class="card toolbar"><input class="field" placeholder="Search customer or VR ID" oninput="filterRows(this.value)">${monthControl('Filter payments by month')}</div><div class="card">${paymentTable(list,true)}</div>`}
    function voucherTable(list,actions=false){if(!list.length)return '<div class="empty">No voucher records found.</div>';return `<div class="table-wrap"><table><thead><tr><th>VR ID</th><th>Customer</th><th>Products</th><th>Date</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th>${actions?'<th>Actions</th>':''}</tr></thead><tbody id="rows">${list.map(v=>{let c=customer(v.customerId),s=status(v),items=(v.items||[]).map(i=>`<span class="chip"><b>${esc(i.product)}</b> × ${esc(i.quantity)} kg</span>`).join('');return `<tr data-status="${s}" data-search="${esc((v.vrId+' '+(c?.name||'')+' '+(v.items||[]).map(i=>i.product).join(' ')).toLowerCase())}"><td><b>${esc(v.vrId)}</b></td><td>${esc(c?.name||'Deleted')}</td><td class="products-cell">${items||'—'}</td><td>${date(v.buyingDate)}</td><td>${money(total(v))}</td><td>${money(paid(v))}</td><td><b>${money(balance(v))}</b></td><td><span class="badge ${s}">${s}</span></td>${actions?`<td>${currentUser.role==='admin'?`<button class="btn link" onclick="voucherForm(${v.id})">Edit</button>${balance(v)>0?`<button class="btn link" onclick="paymentForm(null,${v.id})">Pay</button>`:''}<button class="btn danger" onclick="removeVoucher(${v.id})">Delete</button>`:'Read only'}</td>`:''}</tr>`}).join('')}</tbody></table></div>`}
    function paymentTable(list,actions=false){if(!list.length)return '<div class="empty">No payment records found.</div>';return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Customer</th><th>VR ID</th><th>Amount</th><th>Note</th>${actions?'<th>Access</th>':''}</tr></thead><tbody id="rows">${list.map(p=>{let c=customer(p.customerId),v=voucher(p.voucherId);return `<tr data-search="${esc(((c?.name||'')+' '+(v?.vrId||'')).toLowerCase())}"><td>${date(p.paymentDate)}</td><td>${esc(c?.name||'Deleted')}</td><td>${esc(v?.vrId||'Deleted')}</td><td><b>${money(p.amount)}</b></td><td>${esc(p.note||'—')}</td>${actions?`<td>${currentUser.role==='admin'?`<button class="btn link" onclick="paymentForm(${p.id})">Edit</button>`:'Read only'}</td>`:''}</tr>`}).join('')}</tbody></table></div>`}
    function openForm(title,html,onSubmit){$('#modalTitle').textContent=title;$('#form').innerHTML=html;$('#form').onsubmit=e=>{e.preventDefault();let b=e.submitter;b&&(b.disabled=true);try{onSubmit(new FormData(e.target));save();closeModal()}catch(err){toast(err.message||'Unable to save',true);b&&(b.disabled=false)}};if(typeof modal.showModal==='function'){try{modal.showModal()}catch{modal.setAttribute('open','');modal.classList.add('fallback')}}else{modal.setAttribute('open','');modal.classList.add('fallback')}}
    function closeModal(){if(typeof modal.close==='function')modal.close();else{modal.removeAttribute('open');modal.classList.remove('fallback')}}
    function customerForm(id){if(id&&currentUser.role!=='admin')return toast('Administrator permission required',true);let c=customer(id)||{};openForm(id?'Edit customer':'Add customer',`<div class="form-grid"><div><label>Name</label><input class="field" name="name" value="${esc(c.name)}" required></div><div><label>Location</label><input class="field" name="location" value="${esc(c.location)}" required></div></div><div class="actions"><button type="button" class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div>`,f=>{let data={name:f.get('name').trim(),location:f.get('location').trim()};if(id)Object.assign(c,data);else db.customers.push({id:newId(),...data})})}
    function voucherForm(id){if(id&&currentUser.role!=='admin')return toast('Administrator permission required',true);if(!db.customers.length)return toast('Add a customer first.',true);let v=voucher(id)||{items:[{product:'',quantity:'',unitPrice:'',bagCharges:'',laborCharges:''}],buyingDate:today()},options=db.customers.map(c=>`<option value="${c.id}" ${c.id==v.customerId?'selected':''}>${esc(c.name)}</option>`).join('');openForm(id?'Edit voucher':'Add voucher',`<div class="form-grid"><div><label>VR ID</label><input class="field" name="vrId" value="${esc(v.vrId)}" required></div><div><label>Customer</label><select class="field" name="customerId" required><option value="">Select…</option>${options}</select></div><div><label>Buying date</label><input class="field" type="date" name="buyingDate" value="${v.buyingDate}" required></div><div class="full"><label>Products</label><div id="items">${v.items.map(itemRow).join('')}</div><button type="button" class="btn soft" onclick="addItem()">+ Add product</button><div class="voucher-total"><span>Final voucher price</span><strong id="voucherTotal">${money(total(v))}</strong></div></div></div><div class="actions"><button type="button" class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div>`,f=>{let products=f.getAll('product'),rates=f.getAll('unitPrice'),kgs=f.getAll('quantity'),bags=f.getAll('bagCharges'),labors=f.getAll('laborCharges'),items=products.map((p,n)=>({product:p.trim(),unitPrice:+rates[n],quantity:+kgs[n],bagCharges:+bags[n],laborCharges:+labors[n]}));let data={vrId:f.get('vrId').trim(),customerId:+f.get('customerId'),buyingDate:f.get('buyingDate'),items};if(db.vouchers.some(x=>x.id!=id&&x.vrId.toLowerCase()===data.vrId.toLowerCase()))throw Error('VR ID already exists.');if(id)Object.assign(v,data);else db.vouchers.push({id:newId(),createdBy:currentUser.username,...data})});updateVoucherTotal()}
    function itemRow(x={}){return `<div class="item-row" oninput="updateVoucherTotal()"><div><label>Product</label><input class="field" name="product" value="${esc(x.product)}" required></div><div><label>Rate / kg</label><input class="field" name="unitPrice" type="number" min="0" step="0.01" value="${x.unitPrice??''}" required></div><div><label>Buy kg</label><input class="field" name="quantity" type="number" min="0.01" step="0.01" value="${x.quantity??''}" required></div><div><label>Bag charges</label><input class="field" name="bagCharges" type="number" min="0" step="0.01" value="${x.bagCharges||''}"></div><div><label>Labor charges</label><input class="field" name="laborCharges" type="number" min="0" step="0.01" value="${x.laborCharges||''}"></div><div class="line-wrap"><label>Final price</label><div class="field line-total">${money(itemTotal(x))}</div></div><button type="button" class="close" onclick="this.parentElement.remove();updateVoucherTotal()">×</button></div>`}
    function addItem(){$('#items').insertAdjacentHTML('beforeend',itemRow());updateVoucherTotal()}function updateVoucherTotal(){let sum=0;document.querySelectorAll('#items .item-row').forEach(r=>{let q=n=>+r.querySelector(`[name="${n}"]`).value||0,line=q('unitPrice')*q('quantity')+q('bagCharges')+q('laborCharges');r.querySelector('.line-total').textContent=money(line);sum+=line});$('#voucherTotal')&&($('#voucherTotal').textContent=money(sum))}
    function paymentForm(id,voucherId){if(currentUser.role!=='admin')return toast('Only administrators can record payments.',true);if(!db.vouchers.length)return toast('Add a voucher first.',true);let p=db.payments.find(x=>x.id==id)||{voucherId,paymentDate:today()},available=db.vouchers.filter(v=>v.id==p.voucherId||balance(v)>0),options=available.map(v=>`<option value="${v.id}" ${v.id==p.voucherId?'selected':''}>${esc(v.vrId)} — ${esc(customer(v.customerId)?.name||'')} (due ${money(balance(v))})</option>`).join('');openForm(id?'Edit payment':'Record payment',`<div class="form-grid"><div class="full"><label>Voucher</label><select class="field" name="voucherId" required><option value="">Select…</option>${options}</select></div><div><label>Amount</label><input class="field" name="amount" type="number" min="0.01" step="0.01" value="${p.amount||''}" required></div><div><label>Payment date</label><input class="field" name="paymentDate" type="date" value="${p.paymentDate}" required></div><div class="full"><label>Note</label><textarea class="field" name="note" rows="3">${esc(p.note)}</textarea></div></div><div class="actions"><button type="button" class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div>`,f=>{let v=voucher(+f.get('voucherId')),amount=+f.get('amount'),old=id?+p.amount:0;if(!v)throw Error('Select a voucher.');if(amount>balance(v)+old)throw Error('Payment cannot exceed voucher balance.');let data={voucherId:v.id,customerId:v.customerId,amount,paymentDate:f.get('paymentDate'),note:f.get('note').trim(),recordedBy:currentUser.username};if(id)Object.assign(p,data);else db.payments.push({id:newId(),...data})})}
    function customerRecords(id){let c=customer(id),list=db.vouchers.filter(v=>v.customerId==id&&inMonth(v.buyingDate,monthFilter));openForm(`${esc(c?.name||'Customer')} — voucher records`,`<div class="toolbar"><input class="field" type="month" value="${esc(monthFilter)}" onchange="monthFilter=this.value;closeModal();customerRecords(${id})"><button type="button" class="btn soft" onclick="monthFilter='';closeModal();customerRecords(${id})">All months</button></div><div class="detail-summary"><div><small>Vouchers</small><b>${list.length}</b></div><div><small>Total purchases</small><b>${money(list.reduce((s,v)=>s+total(v),0))}</b></div><div><small>Outstanding</small><b>${money(list.reduce((s,v)=>s+balance(v),0))}</b></div></div><div class="card">${voucherTable(list)}</div><div class="actions"><button type="button" class="btn soft" onclick="closeModal()">Close</button></div>`,()=>{})}
    function removeCustomer(id){if(currentUser.role!=='admin')return;let vids=db.vouchers.filter(v=>v.customerId==id).map(v=>v.id);if(db.payments.some(p=>p.customerId==id||vids.includes(p.voucherId)))return toast('Cannot delete a customer with payment records.',true);if(confirm('Delete this customer and all related vouchers?')){db.vouchers=db.vouchers.filter(v=>v.customerId!=id);db.customers=db.customers.filter(c=>c.id!=id);save()}}
    function removeVoucher(id){if(currentUser.role!=='admin')return;if(db.payments.some(p=>p.voucherId==id))return toast('Cannot delete a voucher with payment records.',true);if(confirm('Delete this voucher?')){db.vouchers=db.vouchers.filter(v=>v.id!=id);save()}}
    function filterRows(q){q=q.toLowerCase();document.querySelectorAll('#rows tr').forEach(r=>r.classList.toggle('hidden',!r.dataset.search.includes(q)))}function filterStatus(s){document.querySelectorAll('#rows tr').forEach(r=>r.classList.toggle('hidden',!!s&&r.dataset.status!==s))}
    Object.assign(window,{setPage,logout,customerForm,voucherForm,paymentForm,customerRecords,removeCustomer,removeVoucher,closeModal,addItem,updateVoucherTotal,filterRows,filterStatus});
    $('#loginForm').addEventListener('submit',login);load();restoreSession();
  </script>
</body>
</html>
